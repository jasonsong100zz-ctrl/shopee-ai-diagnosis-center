name: Skill request
description: Request a new e-commerce Skill or a focused improvement.
title: "skill: "
labels:
  - skill
body:
  - type: markdown
    attributes:
      value: |
        Please describe one repeatable workflow. Separate recurring competitor monitoring from new-product planning.
  - type: input
    id: workflow
    attributes:
      label: Workflow name
      description: What should this Skill do?
      placeholder: Review VOC for one product category
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      description: Links, files, tables, images, market, and platform.
    validations:
      required: true
  - type: textarea
    id: outputs
    attributes:
      label: Outputs
      description: Report, CSV, dashboard, alerts, or other deliverable.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and data risks
      description: What must the Skill not do? What evidence or privacy constraints apply?
    validations:
      required: true
